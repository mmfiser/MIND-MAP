name: Nasazení na GitHub Pages

on:
  push:
    branches: [main]
  # Ruční spuštění (Actions → Nasazení na GitHub Pages → Run workflow).
  # S vyplněným „ref“ nasadí libovolnou starší verzi – např. tag v1.0.0.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag nebo commit k nasazení (prázdné = aktuální main), např. v1.0.0'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Nasazovaná verze
        run: echo "Nasazuji ${{ inputs.ref || github.sha }} ($(git rev-parse --short HEAD))"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testy
        run: npm test

      - name: Určení base cesty
        id: base
        shell: bash
        run: |
          # Repozitářová proměnná VITE_BASE má přednost (např. "/" pro vlastní doménu).
          if [ -n "${{ vars.VITE_BASE }}" ]; then
            echo "value=${{ vars.VITE_BASE }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ steps.base.outputs.value }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
